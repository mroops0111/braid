name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Re-run the full CI matrix on the tagged commit before we publish.
  # Catches the case where master was green but the tag was cut off a
  # different commit, or where a release-only change snuck in.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches root package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Persist dist/ across jobs so publish-npm doesn't rebuild.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            packages/*/dist
            plugins/*/dist
          retention-days: 7

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/org/braidhq
    permissions:
      # Required for `actions/attest-build-provenance`.
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org/'

      # Trusted Publishing (OIDC) requires npm >= 11.5.1. Node 24 ships
      # npm 11.x but not always the OIDC-aware patch; force the latest
      # so the publish step can exchange the ACTIONS_ID_TOKEN for a
      # short-lived registry token.
      - run: npm install -g npm@latest
      - run: npm --version

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      # Attest provenance for every publishable tarball. Consumers can
      # verify via `npm audit signatures` that the package was built from
      # this commit in this repo.
      - name: Pack tarballs
        run: |
          mkdir -p .release
          pnpm -r --filter="./packages/*" --filter="!@braidhq/studio" --filter="!@braidhq/desktop" --filter="!@braidhq/test-utils" exec npm pack --pack-destination "$GITHUB_WORKSPACE/.release"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: '.release/*.tgz'

      # Publish each tarball with `npm publish`, not `pnpm publish -r`.
      # pnpm's publish path is anonymous against the registry and does
      # not negotiate OIDC, so under Trusted Publisher it 404s. npm CLI
      # 11+ exchanges the `id-token: write` workflow permission for a
      # short-lived publish token via npm's OIDC endpoint and signs the
      # provenance statement on the same flow. New packages must be
      # first-published manually so they exist on npm and have a
      # Trusted Publisher configured before this workflow can ship them.
      - name: Publish
        run: |
          shopt -s nullglob
          for tgz in .release/*.tgz; do
            echo "::group::npm publish $tgz"
            npm publish --access public --provenance "$tgz"
            echo "::endgroup::"
          done

  github-release:
    name: GitHub Release
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
