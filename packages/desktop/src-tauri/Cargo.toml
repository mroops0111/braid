[package]
name = "braid-desktop"
version = "0.1.0"
description = "Tauri desktop shell for Braid"
authors = [ "Braid contributors" ]
license = "MIT"
repository = "https://github.com/mroops0111/braid"
edition = "2021"
rust-version = "1.77"

[lib]
name = "braid_desktop_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = [ "derive" ] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
